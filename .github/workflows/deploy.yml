name: Continuous Deployment to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '13.140.166.116' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            cd /var/www/fertilizer-pos

            echo "📦 Fetching latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "📥 Installing dependencies..."
            npm install --production=false

            echo "🔨 Building frontend production assets..."
            npm run build

            echo "🔄 Restarting application in PM2..."
            pm2 restart fertilizer-pos --update-env

            echo "🩺 Verifying application health..."
            sleep 3
            curl -f http://127.0.0.1:3847/api/health || (echo "Health check failed!" && exit 1)

            echo "✅ Deployment completed successfully! Live on http://13.140.166.116"
